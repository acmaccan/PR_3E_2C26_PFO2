<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis tareas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/tareas.css">
</head>
<body>
    <div class="navbar">
        <div class="logo">░▒▓</div>
        <button class="logout-btn" onclick="logout()">cerrar sesión</button>
    </div>

    <div class="container">
        <div class="welcome">
            <h1>Bienvenido de vuelta.</h1>
            <p class="subtitle">Tu espacio para gestionar tareas y mantenerte organizado.</p>
        </div>

        <div class="actions">
            <button class="btn btn-primary">+ Nueva tarea</button>
            <button class="btn">Filtrar</button>
        </div>

        <div class="tasks-section">
            <h2>Mis tareas</h2>
            <div class="tasks-list">
                <div class="empty-state">
                    <p>Sin tareas por el momento</p>
                    <p style="font-size: 12px; color: #475569;">Creá tu primera tarea para comenzar</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/tareas.js"></script>
</body>
</html>
