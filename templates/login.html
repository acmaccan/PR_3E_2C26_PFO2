<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">░▒▓</div>
        </div>

        <div class="main">
            <h1>Bienvenido de vuelta.</h1>
            <p class="subtitle">Iniciá sesión para acceder a tu espacio de trabajo.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="usuario">USUARIO</label>
                    <div class="input-wrapper">
                        <div class="input-prefix">></div>
                        <input type="text" id="usuario" name="usuario" placeholder="Ingresá tu usuario" required>
                    </div>
                    <div class="error-message" id="usuarioError"></div>
                </div>

                <div class="form-group">
                    <label for="contraseña">CONTRASEÑA</label>
                    <div class="input-wrapper">
                        <div class="input-prefix">></div>
                        <input type="password" id="contraseña" name="contraseña" placeholder="ingresá tu contraseña" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('contraseña')">VER</button>
                    </div>
                    <div class="error-message" id="contraseñaError"></div>
                </div>

                <button type="submit" class="submit-btn">
                    iniciar sesión
                    <span>→</span>
                </button>
            </form>
        </div>

        <div class="footer">
            ¿Primera vez? <a href="/registro">crear una cuenta</a>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
